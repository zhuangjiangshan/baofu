<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>给对象修指甲</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app" class="app">
    <section id="homeScreen" class="home-screen">
      <div class="home-bg"></div>
      <div class="home-content">
        <div class="visit-stats" aria-label="访问人数">
          <span>🟢 在线 <b id="onlineCount">--</b></span>
          <span>👀 历史访问 <b id="visitCount">--</b></span>
        </div>
        <p class="kicker">第一人称情侣互动小游戏</p>
        <h1>给对象修指甲</h1>
        <div class="mode-grid" aria-label="选择游戏模式">
          <button class="mode-card" data-mode="boyfriend" type="button">
            <span class="mode-icon">💸</span>
            <span class="mode-title">男友模式</span>
            <span class="mode-desc">合理打钱，让她开心地帮你修完指甲</span>
          </button>
          <button class="mode-card" data-mode="girlfriend" type="button">
            <span class="mode-icon">💅</span>
            <span class="mode-title">女友模式</span>
            <span class="mode-desc">控制力度，在把他弄疼之前赚到5000W</span>
          </button>
        </div>
      </div>
    </section>

    <section id="gameScreen" class="game-screen hidden" aria-live="polite">
      <img id="sceneImage" class="scene-image" alt="">
      <div id="sceneTint" class="scene-tint"></div>
      <div id="redFlash" class="red-flash"></div>
      <div id="sparkLayer" class="spark-layer" aria-hidden="true"></div>

      <div class="top-hud">
        <div class="hud-line">
          <span id="modeLabel">模式</span>
          <span id="timeLabel">60s</span>
        </div>
        <div class="bar timer-bar" aria-label="倒计时">
          <span id="timeBar"></span>
        </div>
        <div class="bar nail-bar" aria-label="修甲进度">
          <span id="nailBar"></span>
        </div>
        <div class="hud-line small">
          <span>修甲进度</span>
          <span id="nailLabel">0%</span>
        </div>
      </div>

      <div id="speechBubble" class="speech-bubble hidden"></div>

      <div class="bottom-status">
        <div id="moneyPanel" class="glass-pill">💰 0W</div>
        <div id="statePanel" class="glass-pill">状态：刚刚好最重要</div>
        <div id="painPanel" class="glass-pill hidden">疼痛：0 / 5</div>
      </div>

      <div id="pressurePanel" class="pressure-panel hidden">
        <div class="pressure-text">
          <span>轻</span>
          <span>最佳</span>
          <span>重</span>
        </div>
        <div class="pressure-track">
          <span class="pressure-zone good"></span>
          <b id="pressureNeedle"></b>
        </div>
      </div>

      <button id="payButton" class="pay-button hidden" type="button">💰 打钱</button>
      <div id="fileTool" class="file-tool hidden" aria-hidden="true"></div>
      <div id="nailTarget" class="nail-target hidden" aria-hidden="true"></div>
      <div id="floatLayer" class="float-layer" aria-hidden="true"></div>

      <div id="resultModal" class="result-modal hidden" role="dialog" aria-modal="true">
        <div class="modal-card">
          <div id="resultIcon" class="result-icon">❤️</div>
          <h2 id="resultTitle">我们约会吧！</h2>
          <p id="resultSubtitle">她好像对你有点心动。</p>
          <div id="scorePanel" class="score-panel hidden"></div>
          <button id="modalAction" type="button">接受</button>
          <button id="homeAction" class="secondary" type="button">回到首页</button>
        </div>
      </div>
    </section>
  </main>

  <script src="game.js"></script>
</body>
</html>
